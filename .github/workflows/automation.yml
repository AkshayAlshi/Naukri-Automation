name: Selenium Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "*/7 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Tests
        run: mvn clean test
